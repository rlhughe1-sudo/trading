
name: Build DBSMPTrade

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build JAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DBSMPTrade
          path: target/*.jar
